<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PRONTO10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap');
        body { background:#0f172a; color:white; font-family:'Archivo',sans-serif; }
        .tab-content { display:none; padding:1.5rem; }
        .tab-content.active { display:block; }
        .player-row { display:flex; justify-content:space-between; items-center:center; padding:12px 0; border-bottom:1px solid #1e293b; }
        .btn-green { background:#10b981; color:white; padding:6px 12px; border-radius:8px; font-weight:900; font-size:11px; }
    </style>
</head>
<body>



<div id="main-app" class="block">
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 sticky top-0 z-50">
        <div>
            <h1 class="text-emerald-400 font-black italic uppercase">🛡️ Admin</h1>
            <p class="text-[10px] text-slate-500 font-bold uppercase">PRONTO10</p>
        </div>
        <button onclick="load()" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">Refrescar 🟢</button>
    </header>

    <main id="tab-jugadores" class="tab-content active">
        <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700">
            <h2 class="text-[10px] font-black text-amber-400 uppercase tracking-widest mb-4">⏳ Esperando Activación</h2>
            <div id="lista-pendientes"></div>
            <hr class="my-6 border-slate-700">
            <h2 class="text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-4">✅ Jugadores Activos</h2>
            <div id="lista-activos"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-slate-900 h-[70px] flex items-center justify-around border-t border-slate-800">
        <button class="text-[10px] font-black uppercase text-emerald-400">👥 Jugadores</button>
    </nav>
</div>

<script>
var API = "https://prode-mundial.emprendimientoweb.workers.dev", EMPRESA = "PRONTO10", TOKEN = "ProdeAdmin2026Julio", PIN = "";

function avanzarPin(el, n) { if(el.value.length===1) document.getElementById(n).focus(); }
function verificarPin() {
    var p = ['p1','p2','p3','p4'].map(id=>document.getElementById(id).value).join('');
    if(p===PIN) { sessionStorage.setItem('auth_'+EMPRESA,'1'); mostrarApp(); }
    else { alert('PIN Incorrecto'); ['p1','p2','p3','p4'].forEach(id=>document.getElementById(id).value=''); }
}
function mostrarApp() {
    if(document.getElementById('pin-screen')) document.getElementById('pin-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('main-app').classList.add('block');
    load();
}
if(!PIN || sessionStorage.getItem('auth_'+EMPRESA)) mostrarApp();

async function load() {
    try {
        const r = await fetch(API+'?accion=admin_view&empresa='+encodeURIComponent(EMPRESA)+'&token='+TOKEN+'&_t='+Date.now());
        const d = await r.json();
        
        let pend = [], act = [], pendNames = [];

        // EL SÚPER ESCÁNER UNIVERSAL: Busca en todas las cajas posibles (solicitudes, usuarios y ranking)
        let totalRaw = [];
        if(d.solicitudes_pendientes) totalRaw = totalRaw.concat(d.solicitudes_pendientes);
        if(d.usuarios) totalRaw = totalRaw.concat(d.usuarios);
        if(d.ranking) totalRaw = totalRaw.concat(d.ranking);

        totalRaw.forEach(u => {
            if(!u || !u.nombre) return;
            let n = u.nombre.trim();
            if(pendNames.includes(n)) return;

            let esPendiente = JSON.stringify(u).toUpperCase().includes('PENDIENTE');
            if(esPendiente) {
                pend.push(u);
                pendNames.push(n);
            } else {
                act.push(u);
            }
        });

        document.getElementById('lista-pendientes').innerHTML = pend.map(u => `
            <div class="player-row">
                <span class="text-sm font-bold">${u.nombre}</span>
                <button onclick="activar('${u.nombre}')" class="btn-green">Activar</button>
            </div>`).join('') || '<p class="text-xs text-slate-500 italic text-center">Sin solicitudes nuevas</p>';

        document.getElementById('lista-activos').innerHTML = act.map(u => `
            <div class="player-row"><span class="text-sm text-slate-400">${u.nombre}</span></div>`).join('');

    } catch(e) { console.error(e); }
}

async function activar(n) {
    if(!confirm('¿Activar a '+n+'?')) return;
    await fetch(API,{method:'POST',body:JSON.stringify({empresa:EMPRESA,usuario:n,id_partido:0,prediccion:'ACTIVADO',token:TOKEN})});
    load();
}
</script>
</body>
</html>
