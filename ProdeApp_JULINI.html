<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#10B981"><title>PRODE - JULINI</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn4+GPC90ZXh0Pjwvc3ZnPg=="><link rel="manifest" id="pwa-manifest" href=""><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap'); :root { --theme: #10B981; } * { box-sizing: border-box; } body { font-family: 'Archivo', sans-serif; background: #f1f5f9; padding-bottom: 88px; } .tab-content { display: none; } .tab-content.active { display: block; } .nav-item.active { color: var(--theme); border-top: 3px solid var(--theme); } .btn-pred.selected { background: var(--theme); color: white; border-color: var(--theme) !important; } .app-header { background: var(--theme); } .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 1rem; } @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } } .badge-pendiente { background: #fef3c7; color: #92400e; } .badge-finalizado { background: #dcfce7; color: #166534; }</style></head><body><header class="app-header text-white p-4 sticky top-0 z-50 shadow-md text-center"><h1 class="font-black italic text-xl uppercase">🏆 JULINI</h1><div id="status-bar" class="text-xs opacity-70 mt-0.5 h-4"></div></header><div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-2 rounded-full text-xs font-bold opacity-0 z-[100] whitespace-nowrap pointer-events-none transition-opacity"></div><main id="tab-votar" class="tab-content active p-4 max-w-md mx-auto"><div class="bg-white p-4 rounded-2xl shadow-sm mb-5 border border-gray-100"><label class="text-[10px] font-black text-gray-400 uppercase block mb-1">Tu Nombre</label><input type="text" id="user_name" onkeyup="saveUser(this.value)" placeholder="Escribí tu nombre..." class="w-full text-base font-bold border-b-2 border-gray-100 py-1 outline-none" /></div><div id="lista-votar" class="space-y-3"><div class="skeleton h-32"></div><div class="skeleton h-32"></div></div><p id="votar-empty" class="hidden text-center text-gray-400 font-bold italic mt-12 text-sm">✅ No hay partidos pendientes</p></main><main id="tab-ranking" class="tab-content p-4 max-w-md mx-auto"><h2 class="font-black text-lg mb-4 text-gray-800 uppercase">🥇 Posiciones</h2><div id="tabla-ranking" class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="skeleton h-48 rounded-2xl"></div></div></main><main id="tab-grupos" class="tab-content p-4 max-w-md mx-auto"><h2 class="font-black text-lg mb-4 text-gray-800 uppercase">📅 Calendario</h2><div id="lista-grupos" class="space-y-2"><div class="skeleton h-10"></div><div class="skeleton h-10"></div></div></main><nav class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md flex h-[72px] items-center justify-around z-50 border-t border-gray-100 shadow-lg"><button onclick="switchTab('votar', this)" class="nav-item active flex flex-col items-center flex-1 py-2"><span class="text-xl">📝</span><span class="text-[9px] font-black uppercase mt-0.5">Votar</span></button><button onclick="switchTab('ranking', this)" class="nav-item flex flex-col items-center flex-1 py-2"><span class="text-xl">🥇</span><span class="text-[9px] font-black uppercase mt-0.5">Ranking</span></button><button onclick="switchTab('grupos', this)" class="nav-item flex flex-col items-center flex-1 py-2"><span class="text-xl">📊</span><span class="text-[9px] font-black uppercase mt-0.5">Grupos</span></button></nav><script>const API="https://prode-mundial.emprendimientoweb.workers.dev";const EMPRESA="JULINI";let cache=null;document.getElementById('user_name').value=localStorage.getItem('prode_user')||'';function saveUser(v){localStorage.setItem('prode_user',v.trim());}function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(()=>{t.style.opacity='0';},3000);}function setStatus(msg){document.getElementById('status-bar').textContent=msg;}function switchTab(id,btn){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');if(cache)renderAll(cache);}function renderAll(data){renderVotar(data.partidos||[]);renderRanking(data.ranking||[]);renderGrupos(data.partidos||[]);}function renderVotar(partidos){const cont=document.getElementById('lista-votar');const empty=document.getElementById('votar-empty');const pending=partidos.filter(p=>p.estado==='Pendiente');if(pending.length===0){cont.innerHTML='';empty.classList.remove('hidden');return;}empty.classList.add('hidden');cont.innerHTML=pending.map(p=>{const voto=localStorage.getItem('voto_'+p.id);const opts=['Local','Empate','Visitante'].map(o=>{const sel=voto===o;return `<button onclick="votar(${p.id},'${o}',this)" data-opcion="${o}" class="btn-pred flex-1 py-2.5 rounded-xl text-[10px] font-black border-2 border-gray-100 text-gray-400${sel?' selected':''} ">${sel?'✅':o}</button>`;}).join('');return `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50"><div class="flex justify-between text-[9px] font-black text-gray-300 uppercase mb-3"><span>${p.grupo||''}</span><span>${p.fecha_str||''} · ${p.hora_arg||''}</span></div><div class="flex justify-between items-center mb-4 gap-2"><span class="flex-1 text-center text-sm font-bold text-gray-800 leading-tight">${p.local}</span><span class="bg-gray-100 px-2 py-1 rounded-lg text-[9px] font-black text-gray-400 shrink-0">VS</span><span class="flex-1 text-center text-sm font-bold text-gray-800 leading-tight">${p.visitante}</span></div><div class="flex gap-2">${opts}</div></div>`;}).join('');}function renderRanking(ranking){const cont=document.getElementById('tabla-ranking');const lista=ranking.filter(r=>!r.empresa||r.empresa===EMPRESA);if(lista.length===0){cont.innerHTML='<p class="p-10 text-center text-gray-400 font-bold italic text-sm">Aún no hay puntos.</p>';return;}cont.innerHTML=lista.map((r,i)=>`<div class="flex items-center p-4 border-b border-gray-50 gap-3 relative"><span class="text-lg w-7 text-center shrink-0">#${i+1}</span><div class="flex flex-col flex-1 overflow-hidden"><span class="font-bold text-gray-700 truncate leading-tight">${r.nombre}</span><span class="text-[9px] text-gray-400 font-bold tracking-wide">${r.aciertos} aciertos</span></div><span class="font-black text-lg tabular-nums shrink-0" style="color:var(--theme)">${r.puntos} <span class="text-[9px] font-normal uppercase">pts</span></span></div>`).join('');}function renderGrupos(partidos){const cont=document.getElementById('lista-grupos');if(!partidos.length){cont.innerHTML='<p class="text-center text-gray-400 font-bold italic text-sm mt-8">Sin partidos</p>';return;}const grupos={};partidos.forEach(p=>{const g=p.grupo||'Otros';if(!grupos[g])grupos[g]=[];grupos[g].push(p);});cont.innerHTML=Object.entries(grupos).map(([g,ps])=>`<div class="mb-4"><h3 class="text-[10px] font-black text-gray-400 uppercase mb-2 px-1">${g}</h3>${ps.map(p=>`<div class="bg-white p-3 rounded-xl mb-1.5 flex items-center gap-2 text-[11px] shadow-sm border border-gray-50"><span class="flex-1 font-bold text-gray-700 text-right truncate">${p.local}</span><span class="bg-gray-800 text-white px-2.5 py-0.5 rounded-lg font-black tabular-nums shrink-0 text-[10px]">${(p.gol_local!==null&&p.gol_local!=='')?p.gol_local:'-'} – ${(p.gol_visitante!==null&&p.gol_visitante!=='')?p.gol_visitante:'-'}</span><span class="flex-1 font-bold text-gray-700 truncate">${p.visitante}</span><span class="text-[9px] px-1.5 py-0.5 rounded font-black ${p.estado==='Finalizado'?'badge-finalizado':'badge-pendiente'} shrink-0 text-center w-10">${p.estado==='Finalizado'?'✓':p.hora_arg||'?'}</span></div>`).join('')}</div>`).join('');}async function fetchData(){try{const sep=API.includes("?")?"&":"?";const res=await fetch(API+sep+"empresa="+encodeURIComponent(EMPRESA));if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();if(data.error)return;cache=data;renderAll(data);setStatus("Live 🟢 "+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}));}catch(e){setStatus("⚠️ Reconectando...");}}async function votar(id,pred,btn){const user=document.getElementById('user_name').value.trim();if(!user){showToast("⚠️ Escribí tu nombre primero");return;}const card=btn.closest('.flex');card.querySelectorAll('.btn-pred').forEach(b=>{b.classList.remove('selected');b.textContent=b.dataset.opcion;});btn.classList.add('selected');btn.textContent='⏳';btn.disabled=true;try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa:EMPRESA,usuario:user,id_partido:id,prediccion:pred})});const data=await res.json();if(data.ok){localStorage.setItem('voto_'+id,pred);btn.textContent='✅';showToast("✅ Guardado");fetchData();}else{showToast("❌ "+(data.error||"Error"));btn.classList.remove('selected');btn.textContent=pred;}}catch(e){showToast("❌ Error de red.");btn.classList.remove('selected');btn.textContent=pred;}finally{btn.disabled=false;}}fetchData();setInterval(fetchData,30000);</script></body></html>
