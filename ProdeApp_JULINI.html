<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#10B981"><title>PRODE - JULINI</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iI2U4ZThmYyIgZD0iTTE4IDNoMVYySDVWM2gxYTIgMiAwIDAgMCAyIDJoNGEyIDIgMCAwIDAgMi0yWk02IDVhNCA0IDAgMCAxLTQtNHYxYTRhNCA0IDAgMCAwIDQgNEg2Wm0xMiAwYTQgNCAwIDAgMCA0LTRWMWE0IDQgMCAwIDEtNCA0aDJaTTEyIDE1YTUgNSAwIDEgMSAwLTEwIDUgNSAwIDAgMSAwIDEwWm0wLThhMyAzIDAgMSAwIDAgNiAzIDMgMCAwIDAgMC02Wm03IDEwaDF2Mkgydi0yaDFhMiAyIDAgMCAxIDItMmgxNGEyIDIgMCAwIDEgMiAyWk01IDE5YTUgNSAwIDAgMSAxMCAwSDEwYTUgNSAwIDAgMS01LTVaIi8+PC9zdmc+"><link rel="manifest" id="pwa-manifest" href=""><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap'); :root { --theme: #10B981; } * { box-sizing: border-box; } body { font-family: 'Archivo', sans-serif; background: #f1f5f9; padding-bottom: 88px; } .tab-content { display: none; } .tab-content.active { display: block; } .nav-item.active { color: var(--theme); border-top: 3px solid var(--theme); } .btn-pred.selected { background: var(--theme); color: white; border-color: var(--theme) !important; } .app-header { background: var(--theme); } .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 1rem; } @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } } .badge-pendiente { background: #fef3c7; color: #92400e; } .badge-finalizado { background: #dcfce7; color: #166534; }</style></head><body><header class="app-header text-white p-4 sticky top-0 z-50 shadow-md text-center"><h1 class="font-black italic text-xl uppercase">🏆 JULINI</h1><div id="status-bar" class="text-xs opacity-70 mt-0.5 h-4"></div></header><div id="pwa-banner" class="hidden fixed bottom-24 left-4 right-4 z-[100]"><div class="bg-gray-900 border-2 border-emerald-500 rounded-2xl p-4 shadow-2xl flex items-center gap-3 text-white"><div class="flex-1"><p class="font-black text-sm">Instalá esta App ⚡</p><p class="text-gray-400 text-[10px]">Agregala a tu inicio para jugar mejor</p></div><button onclick="installPWA()" class="bg-emerald-500 px-4 py-2 rounded-xl font-black text-xs">Instalar</button><button onclick="this.closest('#pwa-banner').remove()" class="px-2">✕</button></div></div><div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-2 rounded-full text-xs font-bold opacity-0 z-[100] transition-opacity"></div><main id="tab-votar" class="tab-content active p-4 max-w-md mx-auto"><div class="bg-white p-4 rounded-2xl shadow-sm mb-5"><label class="text-[10px] font-black text-gray-400 uppercase block mb-1">Tu Nombre</label><input type="text" id="user_name" onkeyup="saveUser(this.value)" placeholder="Escribí tu nombre..." class="w-full text-base font-bold border-b-2 border-gray-100 py-1 outline-none" /></div><div id="lista-votar" class="space-y-3"><div class="skeleton h-32"></div></div><p id="votar-empty" class="hidden text-center text-gray-400 font-bold italic mt-12 text-sm">✅ No hay partidos pendientes</p></main><main id="tab-ranking" class="tab-content p-4 max-w-md mx-auto"><div id="tabla-ranking" class="bg-white rounded-2xl shadow-sm overflow-hidden"><div class="skeleton h-48"></div></div></main><main id="tab-grupos" class="tab-content p-4 max-w-md mx-auto"><div id="lista-grupos" class="space-y-2"><div class="skeleton h-10"></div></div></main><nav class="fixed bottom-0 w-full bg-white flex h-[72px] items-center justify-around z-50 border-t border-gray-100 shadow-lg"><button onclick="switchTab('votar', this)" class="nav-item active flex flex-col items-center flex-1"><span class="text-xl">📝</span><span class="text-[9px] font-black uppercase">Votar</span></button><button onclick="switchTab('ranking', this)" class="nav-item flex flex-col items-center flex-1"><span class="text-xl">🥇</span><span class="text-[9px] font-black uppercase">Ranking</span></button><button onclick="switchTab('grupos', this)" class="nav-item flex flex-col items-center flex-1"><span class="text-xl">📊</span><span class="text-[9px] font-black uppercase">Grupos</span></button></nav><script>let defP=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();defP=e;document.getElementById('pwa-banner').classList.remove('hidden');});function installPWA(){if(defP){defP.prompt();defP=null;document.getElementById('pwa-banner').remove();}}const API="https://prode-mundial.emprendimientoweb.workers.dev";const EMPRESA="JULINI";function saveUser(v){localStorage.setItem('prode_user',v.trim());}function switchTab(id,btn){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');}async function fetchData(){try{const r=await fetch(API+"?empresa="+encodeURIComponent(EMPRESA));const d=await r.json();renderVotar(d.partidos);renderRanking(d.ranking);renderGrupos(d.partidos);document.getElementById('status-bar').textContent="En vivo 🟢";}catch(e){}}function renderVotar(ps){const c=document.getElementById('lista-votar');const pending=ps.filter(p=>p.estado==='Pendiente');c.innerHTML=pending.map(p=>\`<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 mb-3"><div class="flex justify-between text-[10px] font-black text-gray-400 uppercase mb-2"><span>\${p.grupo}</span><span>\${p.fecha_str} \${p.hora_arg}</span></div><div class="flex justify-between items-center mb-4"><span class="flex-1 text-center font-bold">\${p.local}</span><span class="text-[9px] text-gray-300">VS</span><span class="flex-1 text-center font-bold">\${p.visitante}</span></div><div class="flex gap-2">\${['Local','Empate','Visitante'].map(o=>\`<button onclick="votar(\${p.id},'\${o}',this)" class="btn-pred flex-1 py-2 rounded-xl border-2 text-[10px] font-black border-gray-50 text-gray-400">\${o}</button>\`).join('')}</div></div>\`).join('');}function renderRanking(rk){const c=document.getElementById('tabla-ranking');c.innerHTML=rk.map((r,i)=>\`<div class="flex items-center p-4 border-b border-gray-50"><span class="w-8 font-black">#\${i+1}</span><span class="flex-1 font-bold">\${r.nombre}</span><span class="font-black text-emerald-500">\${r.puntos} pts</span></div>\`).join('');}function renderGrupos(ps){const c=document.getElementById('lista-grupos');c.innerHTML=ps.map(p=>\`<div class="bg-white p-3 rounded-xl mb-1 flex items-center justify-between text-xs border border-gray-50"><span>\${p.local} \${p.gol_local!==null?p.gol_local:'-'} - \${p.gol_visitante!==null?p.gol_visitante:'-'} \${p.visitante}</span><span class="text-[9px] font-black opacity-40 uppercase">\${p.estado}</span></div>\`).join('');}async function votar(id,pred,btn){const user=document.getElementById('user_name').value.trim();if(!user){alert("Poné tu nombre!");return;}btn.textContent='⏳';try{const r=await fetch(API,{method:'POST',body:JSON.stringify({empresa:EMPRESA,usuario:user,id_partido:id,prediccion:pred})});const d=await r.json();if(d.ok){btn.textContent='✅';btn.classList.add('selected');setTimeout(fetchData,1000);}else{alert(d.error);btn.textContent=pred;}}catch(e){btn.textContent=pred;}}fetchData();setInterval(fetchData,30000);</script></body></html>
