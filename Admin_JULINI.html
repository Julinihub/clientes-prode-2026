<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - JULINI</title><script src="https://cdn.tailwindcss.com"></script><style>body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }</style></head><body class="p-6 pb-20"><div class="max-w-4xl mx-auto"><header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-700"><div><h1 class="text-2xl font-black" style="color: #10B981">🛡️ ADMIN PRO</h1><p class="text-xs text-slate-400 mt-1">Empresa: <span class="text-white font-bold">JULINI</span></p></div><button onclick="fetchData()" class="px-4 py-2 rounded-lg font-bold transition shadow text-white hover:opacity-80" style="background-color: #10B981" id="btn-update">Actualizar 🟢</button></header><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg h-96 flex flex-col"><h2 class="text-lg font-bold text-slate-200 mb-4 border-b border-slate-700 pb-2">👥 Participantes</h2><div class="overflow-y-auto flex-1" id="lista-participantes"><p class="text-slate-500 italic text-sm text-center py-10">Cargando...</p></div></div><div class="bg-slate-800 rounded-xl p-5 shadow-lg h-96 flex flex-col border-t-4" style="border-top-color: #10B981;"><h2 class="text-lg font-bold mb-4 border-b border-slate-700 pb-2" style="color: #10B981">🥇 Ranking</h2><div class="overflow-y-auto flex-1" id="lista-ranking"><p class="text-slate-500 italic text-sm text-center py-10">Cargando...</p></div></div></div></div><script>const API_URL="https://prode-mundial.emprendimientoweb.workers.dev";const SECRET_TOKEN="PRODE2026_SECURE_KEY_123";const EMPRESA="JULINI";function renderParticipantes(usuarios){const cont=document.getElementById('lista-participantes');if(!usuarios||usuarios.length===0){cont.innerHTML='<p class="text-slate-500 italic text-sm text-center py-10">Sin participantes</p>';return;}cont.innerHTML=usuarios.map(u=>`<div class="flex justify-between items-center py-2 border-b border-slate-700/50"><span class="font-bold text-slate-300">${u.nombre}</span><span class="text-[10px] bg-slate-700 px-2 py-1 rounded-md font-black" style="color: #10B981">${u.total_votos||0} VOTOS</span></div>`).join('');}function renderRanking(ranking){const cont=document.getElementById('lista-ranking');if(!ranking||ranking.length===0){cont.innerHTML='<p class="text-slate-500 italic text-sm text-center py-10">Ranking vacío</p>';return;}cont.innerHTML=ranking.map((r,i)=>`<div class="flex justify-between items-center py-3 border-b border-slate-700/50"><div class="flex items-center gap-3"><span class="text-lg font-black text-slate-500">#${i+1}</span><span class="font-bold text-white">${r.nombre}</span></div><div><span class="block font-black text-xl" style="color: #10B981">${r.puntos||0} pts</span></div></div>`).join('');}async function fetchData(){const btn=document.getElementById('btn-update');try{btn.textContent="Actualizando...";const sep=API_URL.includes("?")?"&":"?";const url=API_URL+sep+"empresa="+encodeURIComponent(EMPRESA)+"&accion=admin_view&token="+encodeURIComponent(SECRET_TOKEN);const res=await fetch(url,{method:'GET'});const data=await res.json();if(data.error){alert(data.error);return;}renderParticipantes(data.usuarios||[]);renderRanking(data.ranking||[]);}catch(err){alert("Error de conexión");}finally{btn.textContent="Actualizar 🟢";}}fetchData();setInterval(fetchData,60000);</script></body></html>
