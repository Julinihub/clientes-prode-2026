<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Prode Test 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap');
        body { font-family:'Archivo',sans-serif; background:#0f172a; color:white; padding-bottom:80px; }
        .pin-digit { width:50px; height:60px; background:#1e293b; border:2px solid #334155; border-radius:1rem; text-align:center; font-size:24px; font-weight:900; color:white; outline:none; }
        .pin-digit:focus { border-color:#10b981; }
        .tab-content { display:none; padding:1.25rem; }
        .tab-content.active { display:block; }
        .btn-nav { color:#64748b; background:none; border:none; padding:8px; cursor:pointer; }
        .btn-nav.active { color:#10b981; }
        .admin-ta { background:#1e293b; border:1px solid #334155; color:white; border-radius:1rem; padding:1rem; width:100%; min-height:150px; font-family:'Archivo',sans-serif; font-weight:600; outline:none; }
    </style>
</head>
<body>

<div id="pin-screen" style="display:none;">
    <h1 class="text-2xl font-black italic uppercase text-white mb-8">Panel Admin</h1>
    <div class="bg-slate-800 p-8 rounded-[2rem] border border-slate-700 w-full max-w-sm">
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 text-center">Ingresá el PIN</p>
        <div class="flex justify-center gap-3 mb-6">
            <input type="password" class="pin-digit" id="p1" maxlength="1" oninput="avanzarPin(this,'p2')">
            <input type="password" class="pin-digit" id="p2" maxlength="1" oninput="avanzarPin(this,'p3')">
            <input type="password" class="pin-digit" id="p3" maxlength="1" oninput="avanzarPin(this,'p4')">
            <input type="password" class="pin-digit" id="p4" maxlength="1" oninput="verificarPin()">
        </div>
        <button onclick="verificarPin()" class="w-full bg-emerald-500 py-3 rounded-xl font-black uppercase">Entrar</button>
    </div>
</div>

<div id="main-app" style="display:block">
    <header class="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-900 z-50">
        <h1 class="text-lg font-black text-emerald-400 italic uppercase">🛡️ Admin</h1>
        <button onclick="load()" class="text-[9px] bg-slate-800 px-3 py-1.5 rounded-lg uppercase font-bold">Refrescar 🟢</button>
    </header>

    <main id="tab-jugadores" class="tab-content active">
        <div class="space-y-6">
            <div>
                <h2 class="text-[10px] font-black text-amber-400 uppercase tracking-widest mb-3">⏳ Pendientes</h2>
                <div id="lista-pendientes" class="space-y-2"></div>
            </div>
            <hr class="border-slate-700">
            <div>
                <h2 class="text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-3">✅ Activos</h2>
                <div id="lista-activos" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <main id="tab-premios" class="tab-content">
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Configurar Premios</h2>
        <textarea class="admin-ta" id="premios-editor">
