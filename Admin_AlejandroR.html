<body class="p-6 max-w-lg mx-auto">
    <header class="mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
        <h1 class="text-xl font-black text-emerald-400 italic uppercase tracking-tighter">🛡️ ADMIN: AlejandroR</h1>
        <button onclick="load()" class="bg-slate-800 px-3 py-1 rounded-md text-[10px] font-bold uppercase hover:bg-slate-700 transition">Refrescar 🟢</button>
    </header>
    
    <div class="space-y-6">
        <div class="bg-slate-800 p-5 rounded-2xl shadow-xl">
            <h2 class="text-xs font-black text-slate-500 uppercase mb-4 tracking-widest">Ranking en Vivo</h2>
            <div id="ranking" class="space-y-3"></div>
        </div>

        <div class="bg-slate-800 p-5 rounded-2xl shadow-xl">
            <h2 class="text-xs font-black text-slate-500 uppercase mb-4 tracking-widest">Actividad de Usuarios</h2>
            <div id="participantes" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const API = "https://prode-mundial.emprendimientoweb.workers.dev";
        const EMPRESA = "AlejandroR";
        const TOKEN = "PRODE2026_SECURE_KEY_123";

        async function load() {
            try {
                const r = await fetch(API+"?accion=admin_view&empresa="+encodeURIComponent(EMPRESA)+"&token="+TOKEN);
                const d = await r.json();
                
                document.getElementById('ranking').innerHTML = d.ranking.map((u,i)=>`
                <div class="bg-slate-700/50 p-4 rounded-xl flex justify-between border border-slate-700 items-center">
                    <span class="font-bold text-sm text-gray-200">#${i+1} ${u.nombre}</span>
                    <span class="font-black text-emerald-400 text-sm">${u.puntos} pts</span>
                </div>`).join('');

                document.getElementById('participantes').innerHTML = d.usuarios.map(u=>`
                <div class="flex justify-between text-xs text-slate-400 italic px-2 border-b border-slate-700/50 pb-2">
                    <span>${u.nombre}</span>
                    <span class="font-bold text-emerald-400/80">${u.total_votos} votos emitidos</span>
                </div>`).join('');
            } catch(e) {}
        }

        load();
        setInterval(load, 60000);
    </script>
</body>
</html>
